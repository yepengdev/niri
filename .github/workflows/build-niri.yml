name: Build niri

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [ "main" ]      # 推送到 main 自动编译（可选）
    tags:
      - 'v*'                  # 推送 v 开头的 tag 时自动构建

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖（官方完整列表）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc clang \
            libudev-dev \
            libgbm-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libinput-dev \
            libdbus-1-dev \
            libsystemd-dev \
            libseat-dev \
            libpipewire-0.3-dev \
            libpango1.0-dev \
            libdisplay-info-dev

      - name: 配置 Rust 工具链
        run: |
          rustup self update
          rustup show

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 编译 niri (release)
        run: cargo build --release

      - name: 打包所有产物（二进制 + 资源文件）
        run: |
          mkdir -p release
          cp target/release/niri release/
          cp resources/niri-session release/
          cp resources/niri.desktop release/
          cp resources/niri-portals.conf release/
          # systemd 文件（非必须，带上也无妨）
          cp resources/niri.service release/         2>/dev/null || true
          cp resources/niri-shutdown.target release/ 2>/dev/null || true
          tar -czf niri-release.tar.gz -C release .

      - name: 上传最终包（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: niri-full              # Artifact 名称，下载时显示
          path: niri-release.tar.gz    # 要上传的文件
