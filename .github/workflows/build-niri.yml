name: Build niri

on:
  workflow_dispatch:  # 手动触发（推荐）
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖（包含 PipeWire 开发库）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config clang \
            libudev-dev libgbm-dev libinput-dev libseat-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dri \
            libgles2-mesa-dev libwayland-dev libavutil-dev \
            libavcodec-dev libavformat-dev libpixman-1-dev \
            libvulkan-dev libdrm-dev wayland-protocols \
            libpipewire-0.3-dev

      - name: 安装 Rust 工具链
        run: |
          rustup self update
          rustup show   # 自动读取 rust-toolchain.toml（如果存在）

      - name: 缓存 Cargo 目录
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 编译 niri（release）
        run: cargo build --release

      - name: 打包产物（二进制 + 资源文件）
        run: |
          mkdir -p release
          cp target/release/niri release/
          cp resources/niri-session release/
          cp resources/niri.desktop release/
          cp resources/niri-portals.conf release/
          # systemd 文件也一并打包，如果你不用可忽略
          cp resources/niri.service release/
          cp resources/niri-shutdown.target release/
          tar -czf niri-release.tar.gz -C release .

      - name: 上传完整包
        uses: actions/upload-artifact@v4
        with:
          name: niri-full
          path: niri-release.tar.gz
